name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages 部署所需权限：读取仓库、写入 Pages、签发 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与本地保持同一大版本：pnpm 10+ 才会读取 pnpm-workspace.yaml 中的
      # allowBuilds 放行规则，版本不一致会导致 CI 与本地行为分叉
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # Node 必须 ≥ 22.13：pnpm 11 内部依赖 node:sqlite 内置模块，
      # 在 Node 20 上会以 ERR_UNKNOWN_BUILTIN_MODULE 直接崩溃
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      # 注：曾试过 enablement: true 让 workflow 自助启用 Pages，实测被拒
      # （Resource not accessible by integration —— GITHUB_TOKEN 无权创建 Pages 站点）。
      # Pages 需在仓库 Settings → Pages 中手动启用一次，之后部署即全自动。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
